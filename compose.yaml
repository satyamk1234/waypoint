services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobs:${POSTGRES_PASSWORD:-local-development-only}@db:5432/jobs
      MODEL_CACHE: /app/.cache/models
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - model-cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres:
  model-cache:
